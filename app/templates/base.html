<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}changewatch{% endblock %}</title>
  {% block head %}{% endblock %}
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1c1d1f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Changewatch">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens ───────────────────────────────────────── */
    :root {
      color-scheme: dark;
      --sans: 'Inter Tight', -apple-system, system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --bg:           #1c1d1f;
      --surface:      #1c1d1f;
      --side:         #17181a;
      --raise:        transparent;
      --raise-strong: rgba(255,255,255,0.04);
      --shadow:       transparent;
      --shadow-strong:transparent;
      --line:         #2b2d31;
      --line-2:       #34363a;
      --line-3:       #3d3f44;

      --ink:   #ecebe6;
      --ink-2: #a8a9ad;
      --ink-3: #8b8c91;
      --ink-4: #5f6065;

      --accent:     #ecebe6;
      --accent-dim: #a8a9ad;
      --accent-glow:rgba(236,235,230,0.25);

      --ok:      #9be3b4;
      --ok-glow: transparent;
      --err:     #f08f87;
      --err-glow:transparent;
      --chg:     #f2c46d;
      --chg-glow:transparent;
      --pen:     #8b8c91;
      --pen-glow:transparent;

      --sidebar-w: 200px;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ── Surfaces (kept class names, now flat) ──────────────── */
    .neu-raised, .neu-raised-sm, .neu-raised-xs {
      background: transparent;
      border: 1px solid var(--line-2);
      border-radius: 8px;
    }
    .neu-raised-xs { border-radius: 6px; }
    .neu-inset {
      background: transparent;
      border: 1px solid var(--line-2);
      border-radius: 8px;
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: 500 13px/1 var(--sans);
      border: 1px solid var(--line-3);
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease;
    }
    .btn:hover { background: var(--raise-strong); border-color: var(--ink-4); }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn.primary:hover { background: #fff; }
    .btn.icon { padding: 0; width: 36px; }
    .btn.danger { color: var(--err); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Status dot ──────────────────────────────────────────── */
    .led {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; flex-shrink: 0;
      background: var(--pen);
    }
    .led.ok      { background: var(--ok); }
    .led.error   { background: var(--err); }
    .led.changed { background: var(--chg); }
    .led.pending { background: var(--pen); }
    .led.lg      { width: 10px; height: 10px; }

    /* ── Chip (status label / filter pill) ──────────────────── */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line-3);
      font: 500 12px/1 var(--sans);
      color: var(--ink-2);
      background: transparent;
    }
    .chip.ok      { color: var(--ok); }
    .chip.error   { color: var(--err); }
    .chip.changed { color: var(--chg); }
    .chip.pending { color: var(--pen); }

    /* ── Eyebrow label ──────────────────────────────────────── */
    .eyebrow {
      font: 500 12px/1 var(--sans);
      color: var(--ink-2);
    }

    /* ── Tabs / segmented control ───────────────────────────── */
    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--line-2);
    }
    .seg button {
      background: transparent; border: 0; cursor: pointer;
      font: 500 13px/1 var(--sans);
      color: var(--ink-2);
      min-height: 40px;
      padding: 0 2px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .seg button:hover { color: var(--ink); }
    .seg button.on, .seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    /* ── Input ──────────────────────────────────────────────── */
    .input {
      background: transparent;
      border: 1px solid var(--line-3);
      border-radius: 6px;
      padding: 0 12px;
      min-height: 40px;
      color: var(--ink);
      font: 14px var(--sans);
      outline: none;
      width: 100%;
    }
    textarea.input { padding: 10px 12px; }
    .input::placeholder { color: var(--ink-4); }
    .input:focus { border-color: var(--ink); }

    /* ── Console / log block ────────────────────────────────── */
    .console {
      background: #141517;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px 14px;
      font: 12px/1.65 var(--mono);
      color: var(--ink-2);
      overflow-x: auto;
    }

    /* ── Color helpers ──────────────────────────────────────── */
    .mono { font-family: var(--mono); }
    .num  { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
    .t-ok  { color: var(--ok); }
    .t-err { color: var(--err); }
    .t-chg { color: var(--chg); }
    .t-pen { color: var(--pen); }
    .t-acc { color: var(--ink); }
    .t-2   { color: var(--ink-2); }
    .t-3   { color: var(--ink-3); }
    .t-4   { color: var(--ink-4); }

    /* ── App shell layout ───────────────────────────────────── */
    .app { display: flex; min-height: 100dvh; }

    .sidebar {
      position: sticky; top: 0;
      height: 100dvh;
      width: var(--sidebar-w);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      background: var(--side);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 16px;
      font: 600 16px/1 var(--sans);
      letter-spacing: -0.01em;
    }
    .brand svg { flex: none; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 6px;
      color: var(--ink-2);
      font: 500 14px/1 var(--sans);
    }
    .nav-item:hover { color: var(--ink); background: var(--raise-strong); }
    .nav-item.active { color: var(--ink); background: rgba(255,255,255,0.07); }
    .nav-spacer { flex: 1; }
    .side-foot {
      padding: 10px 10px 4px;
      border-top: 1px solid var(--line);
      font: 12px/1.4 var(--mono);
      color: var(--ink-3);
    }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .content-card { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 28px 32px 18px;
    }
    .topbar-left h1 {
      font: 600 22px/1.2 var(--sans);
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .topbar-sub { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
    .topbar-breadcrumb {
      font: 400 13px var(--sans);
      color: var(--ink-2);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .topbar-breadcrumb a { text-decoration: underline; text-underline-offset: 3px; }
    .topbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .content-body { flex: 1; padding: 0 32px 40px; min-width: 0; }

    /* ── Mobile bottom tabs ─────────────────────────────────── */
    .mobile-tabs { display: none; }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .content-card { padding-bottom: 72px; }
      .topbar { padding: 16px 16px 12px; }
      .content-body { padding: 0 16px 24px; }
      .topbar-right { width: 100%; }
      .topbar-right .btn { min-height: 44px; }
      .btn { min-height: 44px; }
      .btn.icon { width: 44px; }
      .input { min-height: 44px; }
      .seg button { min-height: 44px; }
      .mobile-tabs {
        display: block;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--side);
        border-top: 1px solid var(--line);
        z-index: 100;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .mobile-tabs-inner { display: flex; }
      .mobile-tab {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        min-height: 56px;
        color: var(--ink-2);
        font: 500 11px var(--sans);
      }
      .mobile-tab.active { color: var(--ink); }
      .mobile-tab-icon { display: flex; align-items: center; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <a href="/" class="brand"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 6 16 3-8h4"/></svg>changewatch</a>
      <a href="/" class="nav-item {% block nav_monitors %}{% endblock %}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Monitors</a>
      <a href="/activity" class="nav-item {% block nav_activity %}{% endblock %}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Activity</a>
      <a href="/tags" class="nav-item {% block nav_tags %}{% endblock %}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/></svg>Tags</a>
      <a href="/settings" class="nav-item {% block nav_settings %}{% endblock %}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
      <div class="nav-spacer"></div>
      <div class="side-foot"><span class="conn-indicator"><span class="led ok" style="margin-right:6px"></span>connected</span><div style="margin-top:4px;color:var(--ink-4)" title="version">{{ app_version }}</div></div>
    </nav>

    <div class="main">
      <div class="content-card">
        <div class="topbar">
          {% block topbar %}{% endblock %}
        </div>
        <div class="content-body">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>

  <nav class="mobile-tabs" aria-label="Main">
    <div class="mobile-tabs-inner">
      <a href="/" class="mobile-tab {% block mob_monitors %}{% endblock %}">
        <div class="mobile-tab-icon"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
        Monitors
      </a>
      <a href="/activity" class="mobile-tab {% block mob_activity %}{% endblock %}">
        <div class="mobile-tab-icon"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        Activity
      </a>
      <a href="/tags" class="mobile-tab {% block mob_tags %}{% endblock %}">
        <div class="mobile-tab-icon"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/></svg></div>
        Tags
      </a>
      <a href="/settings" class="mobile-tab {% block mob_settings %}{% endblock %}">
        <div class="mobile-tab-icon"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div>
        Settings
      </a>
    </div>
  </nav>

  {% block scripts %}{% endblock %}

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
